<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeOS — Phase 1</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f1117; --panel: #171a23; --panel-2: #1e222d; --border: #2a2f3c;
      --text: #e6e8ee; --muted: #8b90a0; --accent: #6d8bff; --accent-2: #4f6ef2;
      --ok: #3fb96b; --warn: #e0a83b; --err: #e05b5b; --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); font-size: 14px; }
    #root { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
    .brand .dot { width: 26px; height: 26px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .brand small { font-weight: 500; color: var(--muted); font-size: 12px; }
    .who { display: flex; align-items: center; gap: 12px; color: var(--muted); }
    .btn { background: var(--accent-2); color: #fff; border: 0; border-radius: 8px;
      padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .15s; }
    .btn:hover { background: var(--accent); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.ghost:hover { border-color: var(--accent); }
    .btn.sm { padding: 5px 10px; font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; }
    .card h2 { margin: 0 0 4px; font-size: 15px; }
    .card .hint { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 5px; }
    input[type=text], input[type=email], input[type=password], textarea {
      width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit; }
    textarea { resize: vertical; min-height: 68px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab { flex: 1; text-align: center; padding: 8px; border-radius: 8px; cursor: pointer;
      color: var(--muted); border: 1px solid transparent; }
    .tab.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
    .doclist { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow: auto; }
    .docitem { display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; cursor: pointer; transition: .12s; }
    .docitem:hover { border-color: var(--accent); }
    .docitem.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .docitem .fn { font-weight: 600; word-break: break-all; }
    .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 3px 7px;
      border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .badge.done { color: var(--ok); border-color: var(--ok); }
    .badge.failed { color: var(--err); border-color: var(--err); }
    .badge.processing, .badge.pending { color: var(--warn); border-color: var(--warn); }
    .fieldrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid var(--border); font-size: 13px; }
    .fieldrow .k { color: var(--muted); }
    .ftype { font-size: 10px; color: var(--accent); text-transform: uppercase; }
    .ocr { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; max-height: 160px; overflow: auto; white-space: pre-wrap; font-size: 12px;
      color: var(--muted); }
    .answer { background: var(--panel-2); border-left: 3px solid var(--accent); border-radius: 6px;
      padding: 12px; margin-top: 10px; white-space: pre-wrap; }
    .msg { padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-top: 10px; }
    .msg.err { background: rgba(224,91,91,.12); border: 1px solid var(--err); color: #ffb4b4; }
    .msg.ok { background: rgba(63,185,107,.12); border: 1px solid var(--ok); color: #a6f0c2; }
    .drop { border: 2px dashed var(--border); border-radius: 10px; padding: 24px; text-align: center;
      color: var(--muted); cursor: pointer; transition: .12s; }
    .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
    .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 13px; }
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite;
      vertical-align: middle; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const API = ""; // same origin

    function useAuth() {
      const [token, setToken] = useState(() => localStorage.getItem("lifeos_token") || "");
      const [email, setEmail] = useState(() => localStorage.getItem("lifeos_email") || "");
      const save = (tok, em) => {
        setToken(tok); setEmail(em);
        localStorage.setItem("lifeos_token", tok);
        localStorage.setItem("lifeos_email", em);
      };
      const clear = () => {
        setToken(""); setEmail("");
        localStorage.removeItem("lifeos_token");
        localStorage.removeItem("lifeos_email");
      };
      return { token, email, save, clear };
    }

    async function api(path, { method = "GET", token, json, form } = {}) {
      const headers = {};
      if (token) headers["Authorization"] = "Bearer " + token;
      let body;
      if (json !== undefined) { headers["Content-Type"] = "application/json"; body = JSON.stringify(json); }
      if (form) body = form;
      const res = await fetch(API + path, { method, headers, body });
      const text = await res.text();
      let data; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) {
        const detail = (data && data.detail) ? data.detail : (typeof data === "string" ? data : res.statusText);
        throw new Error(detail || ("HTTP " + res.status));
      }
      return data;
    }

    function AuthCard({ auth }) {
      const [mode, setMode] = useState("login");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [name, setName] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState("");
      const [ok, setOk] = useState("");

      const submit = async () => {
        setErr(""); setOk(""); setBusy(true);
        try {
          if (mode === "register") {
            await api("/auth/register", { method: "POST", json: { email, password, full_name: name || null } });
            setOk("Registered. Logging you in…");
          }
          const tok = await api("/auth/login", { method: "POST", json: { email, password } });
          auth.save(tok.access_token, email);
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };

      return (
        <div className="card" style={{ maxWidth: 420, margin: "40px auto" }}>
          <div className="tabs">
            <div className={"tab " + (mode === "login" ? "active" : "")} onClick={() => setMode("login")}>Log in</div>
            <div className={"tab " + (mode === "register" ? "active" : "")} onClick={() => setMode("register")}>Register</div>
          </div>
          {mode === "register" && (<>
            <label>Full name (optional)</label>
            <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Jane Doe" />
          </>)}
          <label>Email</label>
          <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" />
          <label>Password</label>
          <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                 placeholder="at least 8 characters"
                 onKeyDown={e => e.key === "Enter" && submit()} />
          <div style={{ marginTop: 16 }}>
            <button className="btn" style={{ width: "100%" }} disabled={busy || !email || !password} onClick={submit}>
              {busy ? <span className="spin" /> : (mode === "register" ? "Create account" : "Log in")}
            </button>
          </div>
          {err && <div className="msg err">{err}</div>}
          {ok && <div className="msg ok">{ok}</div>}
        </div>
      );
    }

    function UploadCard({ token, onUploaded }) {
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState(null);
      const [err, setErr] = useState("");
      const [over, setOver] = useState(false);

      const doUpload = async (file) => {
        if (!file) return;
        setErr(""); setStatus("uploading"); setBusy(true);
        try {
          const form = new FormData();
          form.append("file", file);
          const doc = await api("/documents/upload", { method: "POST", token, form });
          setStatus(doc.upload_status || "done");
          onUploaded(doc);
        } catch (e) { setErr(e.message); setStatus("failed"); } finally { setBusy(false); }
      };

      return (
        <div className="card">
          <h2>Upload a document</h2>
          <p className="hint">PDF, TXT or MD. Text is extracted and key fields are pulled automatically.</p>
          <div className={"drop " + (over ? "over" : "")}
               onDragOver={e => { e.preventDefault(); setOver(true); }}
               onDragLeave={() => setOver(false)}
               onDrop={e => { e.preventDefault(); setOver(false); doUpload(e.dataTransfer.files[0]); }}
               onClick={() => document.getElementById("fileInput").click()}>
            {busy ? <><span className="spin" /> Uploading & extracting…</>
                  : "Drag a file here, or click to choose"}
          </div>
          <input id="fileInput" type="file" accept=".pdf,.txt,.md" style={{ display: "none" }}
                 onChange={e => doUpload(e.target.files[0])} />
          {status && !err && <div className="msg ok">Status: {status}</div>}
          {err && <div className="msg err">{err}</div>}
        </div>
      );
    }

    function DocumentsCard({ token, docs, refresh, selected, onSelect }) {
      const del = async (e, id) => {
        e.stopPropagation();
        if (!confirm("Delete this document?")) return;
        await api("/documents/" + id, { method: "DELETE", token });
        if (selected && selected.id === id) onSelect(null);
        refresh();
      };
      return (
        <div className="card">
          <div className="row" style={{ justifyContent: "space-between" }}>
            <h2>Your documents</h2>
            <button className="btn ghost sm" onClick={refresh}>Refresh</button>
          </div>
          <p className="hint">Click a document to view its extracted fields.</p>
          {docs.length === 0
            ? <div className="empty">No documents yet. Upload one to get started.</div>
            : <div className="doclist">
                {docs.map(d => (
                  <div key={d.id} className={"docitem " + (selected && selected.id === d.id ? "sel" : "")}
                       onClick={() => onSelect(d)}>
                    <div>
                      <div className="fn">{d.filename}</div>
                      <div style={{ marginTop: 4 }}>
                        <span className="badge">{d.doc_type}</span>{" "}
                        <span className={"badge " + d.upload_status}>{d.upload_status}</span>
                      </div>
                    </div>
                    <button className="btn ghost sm" onClick={e => del(e, d.id)}>Delete</button>
                  </div>
                ))}
              </div>}
        </div>
      );
    }

    function DetailCard({ token, selected }) {
      const [detail, setDetail] = useState(null);
      const [busy, setBusy] = useState(false);
      useEffect(() => {
        if (!selected) { setDetail(null); return; }
        setBusy(true);
        api("/documents/" + selected.id, { token })
          .then(setDetail).catch(() => setDetail(null)).finally(() => setBusy(false));
      }, [selected, token]);

      if (!selected) return (
        <div className="card"><h2>Extracted fields</h2>
          <div className="empty">Select a document to see its fields and text.</div></div>);
      return (
        <div className="card">
          <h2>{selected.filename}</h2>
          <p className="hint">Extracted by a single-shot LLM call.</p>
          {busy && <div className="empty"><span className="spin" /> Loading…</div>}
          {detail && <>
            <div>
              {(detail.extracted_fields || []).length === 0
                ? <div className="empty">No fields extracted from this document.</div>
                : (detail.extracted_fields || []).map(f => (
                    <div key={f.id} className="fieldrow">
                      <span className="k">{f.field_name}</span>
                      <span>{f.field_value}</span>
                      <span className="ftype">{f.field_type}</span>
                    </div>
                  ))}
            </div>
            <label style={{ marginTop: 14 }}>Extracted text</label>
            <div className="ocr">{detail.ocr_text || "(no text)"}</div>
          </>}
        </div>
      );
    }

    function ChatCard({ token, hasDocs }) {
      const [q, setQ] = useState("");
      const [ans, setAns] = useState("");
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState("");
      const ask = async () => {
        setErr(""); setAns(""); setBusy(true);
        try {
          const r = await api("/chat", { method: "POST", token, json: { message: q } });
          setAns(r.message.content);
        } catch (e) { setErr(e.message); } finally { setBusy(false); }
      };
      return (
        <div className="card">
          <h2>Ask a question</h2>
          <p className="hint">Answers are grounded in your uploaded documents.</p>
          {!hasDocs && <div className="msg" style={{ color: "var(--muted)", border: "1px solid var(--border)" }}>
            Upload a document first for grounded answers.</div>}
          <textarea value={q} onChange={e => setQ(e.target.value)}
                    placeholder="e.g. When does my lease end? What's the deposit amount?" />
          <div style={{ marginTop: 10 }}>
            <button className="btn" disabled={busy || !q.trim()} onClick={ask}>
              {busy ? <span className="spin" /> : "Ask"}
            </button>
          </div>
          {ans && <div className="answer">{ans}</div>}
          {err && <div className="msg err">{err}</div>}
        </div>
      );
    }

    function App() {
      const auth = useAuth();
      const [docs, setDocs] = useState([]);
      const [selected, setSelected] = useState(null);

      const refresh = useCallback(() => {
        if (!auth.token) return;
        api("/documents", { token: auth.token })
          .then(setDocs)
          .catch(err => { if (String(err.message).includes("401") || String(err.message).toLowerCase().includes("token")) auth.clear(); });
      }, [auth.token]);

      useEffect(() => { refresh(); }, [refresh]);

      if (!auth.token) return (<>
        <Header auth={auth} />
        <AuthCard auth={auth} />
      </>);

      return (<>
        <Header auth={auth} />
        <div className="grid">
          <UploadCard token={auth.token} onUploaded={() => refresh()} />
          <ChatCard token={auth.token} hasDocs={docs.length > 0} />
          <DocumentsCard token={auth.token} docs={docs} refresh={refresh}
                         selected={selected} onSelect={setSelected} />
          <DetailCard token={auth.token} selected={selected} />
        </div>
      </>);
    }

    function Header({ auth }) {
      return (
        <div className="topbar">
          <div className="brand">
            <div className="dot" />
            <div>LifeOS <small>· Phase 1 MVP</small></div>
          </div>
          {auth.token && (
            <div className="who">
              <span>{auth.email}</span>
              <button className="btn ghost sm" onClick={auth.clear}>Log out</button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
